<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263a">
<title>Greater Seattle Soundscape Monitoring Project</title>
<meta name="description" content="A citizen science program designed to collect and analyze audio data for fauna in Seattle, WA. Supported by the University of Washington Student Technology Fee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&amp;family=Public+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<header class="top" id="top">
  <div class="wrap">
    <nav class="bar" aria-label="Primary">
      <a class="brand" href="#top">
        <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true" focusable="false"><circle cx="17" cy="17" r="16" stroke="#6a9bd1" stroke-width="1.5"/><path d="" stroke="#f6f4ea" stroke-width="2.8" stroke-linecap="round" fill="none"/></svg>
        <span><b data-k="nav.orgName"></b><span data-k="nav.orgSub"></span></span>
      </a>
    </nav>

    <div class="hero">
      <div class="hero-copy">
        <h1 data-k="hero.headline"></h1>
        <p data-k="hero.subhead"></p>
        <div class="actions">
          <a class="btn btn-primary" href="#rsvp"><span data-k="hero.ctaPrimary"></span></a>
          <a class="btn btn-line on-dark" href="#how"><span data-k="hero.ctaSecondary"></span></a>
        </div>
        <p class="sponsor" data-k="hero.sponsorLine"></p>
      </div>
    </div>
  </div>
  <div class="hero-image">
    <img src="assets/crow_hero_cropped.webp" data-k-alt="hero.imageAlt" alt="" width="1100" height="616">
  </div>
</header>

<div class="stats">
  <div class="wrap">
    <div class="stat"><strong data-k="stats.1.value"></strong><span data-k="stats.1.label"></span></div>
    <div class="stat"><strong data-k="stats.2.value"></strong><span data-k="stats.2.label"></span></div>
    <div class="stat"><strong data-k="stats.3.value"></strong><span data-k="stats.3.label"></span></div>
    <div class="stat"><strong data-k="stats.4.value"></strong><span data-k="stats.4.label"></span></div>
  </div>
</div>

<main id="main" tabindex="-1">

  <section id="how">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-k="how.heading"></h2>
        <p data-k="how.subhead"></p>
      </div>
      <div class="process">
        <template data-repeat="how.step">
          <div class="step">
            <div class="step-num" aria-hidden="true" data-auto-index></div>
            <div class="step-body">
              <b data-k="title"></b>
              <p data-k="body"></p>
            </div>
          </div>
        </template>
        <div class="step">
          <div class="step-num" aria-hidden="true">1</div>
          <div class="step-body">
            <b></b>
            <p></p>
          </div>
        </div>
        <div class="step">
          <div class="step-num" aria-hidden="true">2</div>
          <div class="step-body">
            <b></b>
            <p></p>
          </div>
        </div>
        <div class="step">
          <div class="step-num" aria-hidden="true">3</div>
          <div class="step-body">
            <b></b>
            <p></p>
          </div>
        </div>
      </div>
    </div>
    <div class="how-image">
      <img src="assets/bat_how_cropped.webp" data-k-alt="how.imageAlt" alt="A researcher in blue gloves holding a small brown bat">
    </div>
  </section>

  <section class="mission" aria-labelledby="why-h">
    <div class="wrap">
      <div>
        <blockquote id="why-h" data-k="mission.quote"></blockquote>
      </div>
      <div class="side">
        <template data-repeat="mission.body"><p data-k="text"></p></template>
      </div>
    </div>
  </section>

  <section id="faq" aria-labelledby="faq-h">
    <div class="wrap">
      <div class="sec-head">
        <h2 id="faq-h" data-k="faq.heading"></h2>
      </div>
      <div class="faq">
        <template data-repeat="faq">
          <details><summary data-k="q"></summary><p data-k="a"></p></details>
        </template>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="rsvp" id="rsvp">
      <div>
        <h2 data-k="rsvp.heading"></h2>
        <p data-k="rsvp.body"></p>
        <p>
          <b data-k="rsvp.datesLabel"></b> <span data-k="rsvp.datesText"></span>
        </p>
      </div>
      <a class="btn btn-primary" data-k-href="rsvp.buttonHref" href="" target="_blank" rel="noopener"><span data-k="rsvp.button"></span><span class="sr-only"> (opens in a new tab)</span></a>
    </div>
  </div>

  <section id="sponsors" aria-labelledby="sponsors-h">
    <div class="wrap">
      <div class="sec-head">
        <h2 id="sponsors-h" data-k="sponsors.heading"></h2>
        <p data-k="sponsors.subhead"></p>
      </div>
      <ul class="sponsor-row">
        <template data-repeat="sponsors">
          <li><a data-k-href="href" href="#" target="_blank" rel="noopener"><img data-k-src="src" data-k-alt="alt" src="" alt=""></a></li>
        </template>
      </ul>
    </div>
  </section>

</main>

<footer>
  <div class="wrap foot">
    <div>
      <div class="fbrand" data-k="footer.brand"></div>
      <div style="margin-top:8px;max-width:32ch" data-k="footer.tagline"></div>
    </div>
    <div class="cols">
      <div><b data-k="footer.contactLabel">Contact</b><div><a data-k="footer.contactLinkText" data-k-href="footer.contactLinkHref" href="https://uw-echospace.github.io/" target="_blank" rel="noopener">Echospace Group</a>,<br><span data-k="footer.contactLine2">Applied Physics Lab &amp; eScience Institute,</span> <br><span data-k="footer.contactLine3">University of Washington</span></div><div><a data-k="footer.contactEmail" data-k-href="footer.contactEmailHref" href="mailto:soundscape.seattle@gmail.com">soundscape.seattle@gmail.com</a></div></div>
    </div>
  </div>
</footer>

<div class="sticky" id="sticky" aria-hidden="true">
  <div data-k="sticky.text"></div>
  <a class="btn btn-primary" href="#rsvp" tabindex="-1"></a>
</div>

<script src="content-loader.js" defer></script>
<script>
(function(){
  var s=document.getElementById('sticky'),hero=document.querySelector('.hero .actions'),fin=document.getElementById('rsvp');
  if(!('IntersectionObserver' in window)){s.classList.add('on');return;}
  var heroVis=true,finVis=false;
  function upd(){s.classList.toggle('on',!heroVis&&!finVis);}
  new IntersectionObserver(function(e){heroVis=e[0].isIntersecting;upd();}).observe(hero);
  new IntersectionObserver(function(e){finVis=e[0].isIntersecting;upd();}).observe(fin);
})();
</script>
</body>
</html>
